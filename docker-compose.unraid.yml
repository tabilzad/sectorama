# Sectorama on Unraid: the app and its InfluxDB 2.x database as one stack.
#
# Deploy it as a stack in the Docker Compose Manager plugin or in Portainer, or run
#   docker compose -f docker-compose.unraid.yml up -d
# over SSH. Walkthrough: README → Install on Unraid.
#
# Set INFLUXDB_TOKEN (any long random string) in the stack's environment before the
# first start. The stack refuses to start without it.

services:
  app:
    image: tabilzad/sectorama:latest
    container_name: sectorama
    restart: unless-stopped
    privileged: true            # required: smartctl + fio need raw block device access
    ports:
      - "8888:8888"             # host:container — change the left side if 8888 is taken
    networks:
      - internal
    volumes:
      - /mnt/user/appdata/sectorama:/data           # SQLite database
      - /var/local/emhttp:/var/local/emhttp:ro      # array status: per-disk used / free on the dashboard
    environment:
      - NODE_ENV=production
      - PORT=8888
      - TZ=${TZ:-UTC}           # benchmark schedules follow this time zone, e.g. Europe/Berlin
      - SQLITE_PATH=/data/sectorama.db
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?set INFLUXDB_TOKEN to a long random string}
      - INFLUXDB_ORG=sectorama
      - INFLUXDB_BUCKET=sectorama
      # Optional pins. Leave blank to manage these from the Settings page; a value here locks the field there.
      - SMART_POLL_INTERVAL_MINUTES=${SMART_POLL_INTERVAL_MINUTES:-}
      - SMART_POLL_CONCURRENCY=${SMART_POLL_CONCURRENCY:-}
      - BENCHMARK_NUM_POINTS=${BENCHMARK_NUM_POINTS:-}
      - TEMPERATURE_ALERT_THRESHOLD_CELSIUS=${TEMPERATURE_ALERT_THRESHOLD_CELSIUS:-}
    labels:
      # Icon and WebUI link on Unraid's Docker tab
      net.unraid.docker.icon: "https://raw.githubusercontent.com/tabilzad/sectorama/master/packages/frontend/public/pwa-512x512.png"
      net.unraid.docker.webui: "http://[IP]:[PORT:8888]/"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8888/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    depends_on:
      influxdb:
        condition: service_healthy

  influxdb:
    image: influxdb:2           # keep on 2.x: Sectorama queries with Flux, which InfluxDB 3 does not support
    container_name: sectorama-influxdb
    restart: unless-stopped
    networks:
      - internal                # not published on the host; only the app talks to it
    volumes:
      - /mnt/user/appdata/sectorama-influxdb:/var/lib/influxdb2
    environment:
      # Applied once, on the first start with an empty data folder.
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:-adminpass}
      - DOCKER_INFLUXDB_INIT_ORG=sectorama
      - DOCKER_INFLUXDB_INIT_BUCKET=sectorama
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:?set INFLUXDB_TOKEN to a long random string}
      # History kept, in seconds (the trailing "s" is the unit InfluxDB requires); 0 = forever. Default: 180 days.
      - DOCKER_INFLUXDB_INIT_RETENTION=${INFLUXDB_RETENTION_SECONDS:-15552000}s
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  internal:       # private network for app↔influxdb traffic
